name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RagSharp.sln
      - run: dotnet build RagSharp.sln --configuration Release --no-restore
      - run: dotnet test RagSharp.sln --configuration Release --no-build
